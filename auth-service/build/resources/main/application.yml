server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: auth_user
    password: auth_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect # MySQL 8.0으로 업그레이드
jwt:
  secret: eW91cnNlY3JldGtleXlvdXJzZWNyZXRrZXl5b3Vyc2VjcmV0a2V5eW91cnNlY3JldA== #yoursecretkeyyoursecretkeyyoursecretkeyyoursecretkey
  access-token-expiration: 3600000     # 1시간
  refresh-token-expiration: 86400000   # 1일

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka