server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/post/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: eW91cnNlY3JldGtleXlvdXJzZWNyZXRrZXl5b3Vyc2VjcmV0a2V5eW91cnNlY3JldA==  # base64 인코딩된 key
