server:
  port: 8080

spring:
  application:
    name: gateway-service

  codec:
    max-in-memory-size: 10MB  # <-- 여기가 중요. 기본은 256KB로, JSON이 클 경우 문제됨

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/posts/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: eW91cnNlY3JldGtleXlvdXJzZWNyZXRrZXl5b3Vyc2VjcmV0a2V5eW91cnNlY3JldA==  # base64 인코딩된 key

logging:
  level:
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: DEBUG