server:
  port: 8082

spring:
  application:
    name: post-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    url: jdbc:mysql://localhost:3306/post_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: post_user
    password: post_pass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect # MySQL 8.0으로 업그레이드

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

file:
  upload-path: uploads    # 실제 파일 저장 경로 (예: ./uploads)
  thumbnail-width: 200
  thumbnail-height: 200